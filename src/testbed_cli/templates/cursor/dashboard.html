<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>tb testbed</title>
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0;
      font-family: ui-sans-serif, system-ui, sans-serif;
      background: #111;
      color: #eee;
    }
    header { padding: 16px 20px 8px; }
    h1 { font-size: 16px; margin: 0 0 4px; font-weight: 600; }
    p { margin: 0; color: #9a9a9a; font-size: 13px; }
    pre {
      margin: 12px 16px 16px;
      padding: 12px 14px;
      background: #1b1b1b;
      border: 1px solid #2a2a2a;
      border-radius: 8px;
      white-space: pre-wrap;
      word-break: break-word;
      font: 13px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace;
    }
  </style>
</head>
<body>
  <header>
    <h1>tb testbed</h1>
    <p>Status from the last dashboard or status tool call.</p>
  </header>
  <pre id="status">Waiting for host...</pre>
  <script>
    function textFromContent(content) {
      if (typeof content === "string") return content;
      if (!Array.isArray(content)) return "";
      return content.map(function (block) {
        if (!block) return "";
        if (typeof block === "string") return block;
        return block.text || block.html || "";
      }).join("\n");
    }

    function show(payload) {
      var node = document.getElementById("status");
      var text = "";
      if (typeof payload === "string") {
        text = payload;
      } else if (payload && payload.params) {
        text = textFromContent(payload.params.content) || textFromContent(payload.params.result);
      } else if (payload && payload.result) {
        text = textFromContent(payload.result.content) || JSON.stringify(payload.result, null, 2);
      }
      if (!text && payload) {
        text = JSON.stringify(payload, null, 2);
      }
      if (text) node.textContent = text;
    }

    window.addEventListener("message", function (event) {
      show(event.data);
    });
  </script>
</body>
</html>
